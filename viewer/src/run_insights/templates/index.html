<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research runs</title>
<style>
:root{color-scheme:light dark;font-family:system-ui;color:light-dark(#17252c,#e5edf4);background:light-dark(#f4f6f8,#10181e)}
body{margin:0}main{max-width:1100px;margin:60px auto;padding:24px}h1{font-size:2.6rem;letter-spacing:-.06em}
p,.run span{color:light-dark(#52636d,#acbac5)}input{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:20px 0}
.run{display:flex;gap:20px;justify-content:space-between;padding:22px;margin:10px 0;background:light-dark(white,#1a252d);
border:1px solid light-dark(#dce3e8,#35434d);border-radius:12px;color:inherit;text-decoration:none}
[hidden]{display:none!important}.run b{overflow-wrap:anywhere}.run span{min-width:110px}
a:focus-visible{outline:3px solid #2474bd}@media(max-width:600px){.run{display:block}.run span{display:block;margin-top:12px}}
</style>
</head>
<body><main><small>RUN INSIGHTS</small><h1>Research runs</h1>
<p>Follow the team’s attack chain. Inspect the evidence behind each insight.</p>
<p>__COUNT__ saved runs. Viewing requires no model key.</p>
<label for="search">Find a run</label><input id="search" type="search" placeholder="Filter run names">
<section>__RUNS__</section></main>
<script>document.querySelector('#search').addEventListener('input',e=>document.querySelectorAll('.run').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(e.target.value.toLowerCase())))</script>
</body></html>
