<!doctype html>
<!-- Shell, styles and note-taking adapted from the Odd Number trace explorer
     (github.com/Antonio-Tresol/odd-number-reward-hacking), MIT License,
     Copyright (c) 2026 Antonio Badilla-Olivas. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOC-Arena runs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Colour built in OKLCH and fitted to sRGB. Hue carries the meaning: magenta is a step a
   monitor flagged, teal is a step a monitor scored below the audit threshold, orange is
   covert (the sealed verifier's evidence, or an attack tool), indigo is you, grey is an
   absence. Everything else is structure and means nothing. */
:root {
  /* The browser draws its own scrollbars and form controls in this scheme. */
  color-scheme: light;
  --paper: #fcfaf7; --surface: #ffffff; --sunken: #f5f3ef;
  --line: #e2dfda; --line-strong: #c8c4bc;
  --ink: #29231d; --ink-muted: #69625a; --ink-faint: #989189;
  --accent: #3a58c3; --accent-soft: #e5edfe; --accent-ink: #ffffff;
  --flag: #b22578; --flag-soft: #ffe7f1;
  --clean: #026d64; --clean-soft: #d9f6f1;
  --covert: #b25a00; --covert-soft: #fff0dc;
  --none: #8e8c87; --reader-mark: #fadb90;
  --shadow: 0 1px 2px rgba(41, 35, 29, .06);
  --shadow-lift: 0 6px 24px rgba(41, 35, 29, .14);
  --ui: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --read: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #13161c; --surface: #1d2027; --sunken: #272b34;
    --line: #363b44; --line-strong: #4d535e;
    --ink: #edebe7; --ink-muted: #aeaaa2; --ink-faint: #7e7a72;
    --accent: #90aeff; --accent-soft: #293452; --accent-ink: #13161c;
    --flag: #f47db9; --flag-soft: #4c283a;
    --clean: #5cc6b9; --clean-soft: #153d38;
    --covert: #f0a15a; --covert-soft: #45300f;
    --none: #6b6963; --reader-mark: #685217;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lift: 0 6px 24px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #13161c; --surface: #1d2027; --sunken: #272b34;
  --line: #363b44; --line-strong: #4d535e;
  --ink: #edebe7; --ink-muted: #aeaaa2; --ink-faint: #7e7a72;
  --accent: #90aeff; --accent-soft: #293452; --accent-ink: #13161c;
  --flag: #f47db9; --flag-soft: #4c283a;
  --clean: #5cc6b9; --clean-soft: #153d38;
  --covert: #f0a15a; --covert-soft: #45300f;
  --none: #6b6963; --reader-mark: #685217;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lift: 0 6px 24px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { height: 100%; font-size: var(--base, 14px); }
body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 1rem; line-height: 1.45; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; }
.help { font-size: .82rem; color: var(--ink-muted); line-height: 1.6; }
.help p + p { margin-top: .6em; }
.help code, code { font-family: var(--mono); font-size: .9em; background: var(--sunken); padding: 0 4px; border-radius: 4px; }

/* shell: a rail that never scrolls, and one view at a time beside it */
.app { display: grid; grid-template-columns: 212px minmax(0, 1fr); height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.railtop { display: flex; align-items: flex-start; gap: 6px; padding: 14px 10px 10px 16px; }
.rail .brand { flex: 1; min-width: 0; font-weight: 600; font-size: 1.02rem; line-height: 1.3; }
.rail .brand small { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-faint); font-family: var(--mono); margin-top: 3px; overflow-wrap: anywhere; }
.rail .collapse { flex-shrink: 0; border: 0; background: transparent; color: var(--ink-faint); padding: 3px; border-radius: 6px; line-height: 0; }
.rail .collapse:hover { color: var(--ink); background: var(--sunken); }
.app[data-rail="mini"] { grid-template-columns: 60px minmax(0, 1fr); }
.app[data-rail="mini"] .rail .brand, .app[data-rail="mini"] .rail .foot,
.app[data-rail="mini"] .rail nav button .lbl { display: none; }
.app[data-rail="mini"] .railtop { padding: 14px 0 10px; justify-content: center; }
.app[data-rail="mini"] .rail nav { padding: 4px 8px; }
.app[data-rail="mini"] .rail nav button { justify-content: center; padding: 9px 0; position: relative; }
.app[data-rail="mini"] .rail nav button .tally { position: absolute; top: 2px; right: 4px; margin: 0; font-size: .62rem; }
.rail nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.rail nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: transparent; border-radius: 7px; font-size: .88rem; color: var(--ink-muted); text-align: left; }
.rail nav button:hover { color: var(--ink); background: var(--sunken); }
.rail nav button[aria-current="true"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
.rail nav button .tally { margin-left: auto; font-family: var(--mono); font-size: .74rem; color: var(--accent); }
.rail .foot { margin-top: auto; padding: 13px 15px; border-top: 1px solid var(--line); font-size: .76rem; color: var(--ink-faint); line-height: 1.6; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { flex-shrink: 0; height: 52px; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 20px; display: flex; align-items: center; gap: 8px; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: .88rem; color: var(--ink-muted); }
.crumbs button { border: 0; background: none; padding: 0; color: inherit; font-size: inherit; }
.crumbs button:hover { color: var(--accent); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.crumbs svg { color: var(--ink-faint); flex-shrink: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: .82rem; color: var(--ink-muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.view { flex: 1; min-height: 0; overflow: auto; }
.view[hidden] { display: none; }
#view-steps:not([hidden]) { display: flex; flex-direction: column; overflow: hidden; }
.pad { padding: 22px 26px 60px; }
.pad h1 { font-size: 1.5rem; margin-bottom: 5px; overflow-wrap: anywhere; }
.pad h2 { font-size: 1.05rem; margin: 30px 0 6px; }
.lede { color: var(--ink-muted); font-size: .92rem; line-height: 1.6; max-width: 88ch; margin: 0 0 22px; }

/* overview grid: rounds down, monitors then agents across */
.gridwrap { overflow-x: auto; }
.land { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 900px; table-layout: fixed; }
.land th { font-weight: 600; color: var(--ink-muted); font-size: .74rem; padding: 0 2px 7px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.land th.mon { color: var(--accent); }
.land th.rowh { text-align: left; width: 92px; font-size: .78rem; color: var(--ink); font-weight: 500; }
.land td { padding: 0; }
.land td.gap { width: 10px; }
.hm { display: block; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 6px 3px 5px; font-family: var(--mono); font-size: .86rem; font-variant-numeric: tabular-nums; line-height: 1.15; text-align: center; background: var(--surface); color: var(--ink-faint); position: relative; }
.hm:hover { border-color: var(--accent); }
.hm small { display: block; font-size: .62rem; color: var(--ink-faint); margin-top: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hm.flag { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); font-weight: 600; }
.hm.clean { color: var(--clean); }
.hm.covert::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 999px; background: var(--covert); }
.hm.covert { box-shadow: inset 0 0 0 1px var(--covert); }
.hm.empty { border-style: dashed; background: transparent; cursor: default; padding: 12px 3px; }
.hm.empty:hover { border-color: var(--line); }
.hm[aria-pressed="true"] { outline: 2px solid var(--accent); }
.legendrow { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: .8rem; color: var(--ink-muted); margin: 0 0 12px; }
.legendrow .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }
.legendrow .sw.flag { background: var(--flag-soft); border-color: var(--flag); }
.legendrow .sw.clean { background: var(--surface); border-color: var(--clean); }
.legendrow .sw.covert { background: var(--covert); border-color: var(--covert); border-radius: 999px; width: 9px; height: 9px; vertical-align: 0; }
.legend { border-collapse: collapse; font-size: .84rem; margin: 10px 0; width: 100%; }
.legend th { font-weight: 600; text-align: left; vertical-align: top; padding: 6px 12px 6px 0; white-space: nowrap; color: var(--ink-muted); font-size: .76rem; }
.legend td { padding: 6px 12px 6px 0; border-top: 1px solid var(--line); color: var(--ink); vertical-align: top; }
.legend td.num, .legend th.num { text-align: right; font-family: var(--mono); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: .88rem; }
details + details { margin-top: 8px; }
.milestones { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
.ms { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 12px; font-size: .84rem; }
.ms .st { font-family: var(--mono); font-size: .72rem; font-weight: 600; }
.ms.yes .st { color: var(--covert); }
.ms.no .st { color: var(--ink-faint); }
.ms .links { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }

/* filter bar */
.filterbar { flex-shrink: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 11px 20px; display: flex; flex-direction: column; gap: 9px; }
.fldrow[hidden] { display: none; }
.fldrow { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.fld { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 0 8px; font-size: .84rem; color: var(--ink-muted); height: 32px; white-space: nowrap; }
.fld:focus-within { border-color: var(--accent); }
.fld select, .fld input { border: 0; background: transparent; font-size: .84rem; color: var(--ink); padding: 0; height: 30px; min-width: 0; }
.fld select { font-weight: 600; }
.fld input { width: 100%; }
.fld input::placeholder { color: var(--ink-faint); font-weight: 400; }
.fld.grow { flex: 1; min-width: 150px; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 0 11px; height: 32px; font-size: .84rem; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; background: var(--ink); color: var(--paper); border: 0; border-radius: 6px; padding: 3px 9px; }
.chip i { opacity: .55; font-style: normal; }
.chip.quiet { background: var(--sunken); color: var(--ink); border: 1px solid var(--line); }
.chip.quiet:hover { border-color: var(--accent); }

/* steps split */
.split { flex: 1; display: flex; min-height: 0; }
.listcol { flex-shrink: 0; width: 360px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.listhead { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: .82rem; color: var(--ink-muted); }
.listhead b { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.listscroll { flex: 1; overflow: auto; padding: 10px 12px 40px; }
.list { display: flex; flex-direction: column; gap: 5px; }
.row { display: grid; grid-template-columns: 34px 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; text-align: left; }
.row:hover { border-color: var(--accent); }
.row[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row .k { font-family: var(--mono); font-size: .76rem; color: var(--ink-faint); }
.row .lab { font-size: .78rem; color: var(--ink-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .lab b { color: var(--ink); font-weight: 500; }
.row .ch { font-family: var(--mono); font-size: .74rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 5px; }
.row .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--covert); display: none; }
.row.covert .dot { display: inline-block; }
.row .pen { color: var(--accent); display: none; }
.row.mine .pen { display: inline-flex; }
.row.read { background: var(--sunken); }
.row.read .k, .row.read .lab { opacity: .6; }
.row .tick { color: var(--clean); display: none; }
.row.read .tick { display: inline-flex; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-family: var(--mono); font-size: .76rem; font-variant-numeric: tabular-nums; text-align: center; background: var(--sunken); color: var(--ink-faint); }
.pill.flag { background: var(--flag-soft); color: var(--flag); font-weight: 600; }
.pill.clean { background: var(--clean-soft); color: var(--clean); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; border-radius: 5px; padding: 1px 7px; border: 1px solid var(--line); color: var(--ink-muted); background: var(--surface); text-transform: none; letter-spacing: 0; font-weight: 500; }
.tag.covert { color: var(--covert); border-color: var(--covert); background: var(--covert-soft); }
.tag.blocked { color: var(--flag); border-color: var(--flag); }
.more { margin-top: 9px; border: 1px dashed var(--line-strong); background: transparent; border-radius: 8px; padding: 7px; width: 100%; color: var(--accent); font-size: .84rem; }
.divider { flex-shrink: 0; width: 5px; margin-left: -3px; cursor: col-resize; background: transparent; }
.divider:hover, .divider.active { background: var(--accent); opacity: .35; }

/* reader, with notes in the margin beside the passage they quote */
.readcol { flex: 1; min-width: 0; overflow: auto; }
.reader { padding: 18px 22px 80px; max-width: 1060px; margin: 0 auto; }
.reader.nogutter { max-width: calc(80ch + 44px); }
.app[data-focus="read"] .listcol,
.app[data-focus="read"] .divider,
.app[data-focus="read"] .filterbar { display: none; }
.reader .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: 1000px; }
.reader .head h2 { font-family: var(--mono); font-weight: 500; font-size: .92rem; }
.provenance { width: 100%; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.provenance .eyebrow { display: block; margin-bottom: 6px; }
.reader .meta { font-size: .8rem; color: var(--ink-muted); }
.reader .meta .pos.out { color: var(--accent); font-weight: 600; }
.reader .meta code { font-size: .92em; }
.reader .navb { display: flex; gap: 6px; margin-left: auto; }
.reader h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin: 22px 0 8px; font-weight: 600; }
.reader h3 span.q { text-transform: none; letter-spacing: 0; font-weight: 400; }
.reader .sub { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 10px 0 5px; font-weight: 600; }
.reader details.prompt summary { font-size: .8rem; }
.reader details.prompt[open] summary { margin-bottom: 6px; }
.idline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; font-family: var(--mono); font-size: .78rem; color: var(--ink-muted); }
.idline code { user-select: all; overflow-wrap: anywhere; }
.copy { font-size: .74rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-muted); border-radius: 5px; padding: 2px 8px; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.copy.done { color: var(--clean); border-color: var(--clean); }
.reader h3 .copy { margin-left: auto; flex-shrink: 0; }
.verdict { border: 1px solid var(--line); border-left: 4px solid var(--clean); background: var(--surface); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: .88rem; }
.verdict.flag { border-left-color: var(--flag); }
.verdict .vh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .78rem; color: var(--ink-muted); margin-bottom: 3px; }
.verdict .vh b { color: var(--ink); font-weight: 600; }
.split-read { position: relative; display: flex; align-items: flex-start; gap: 0; }
.textcol { flex: 1; min-width: 0; max-width: 80ch; }
.gutter { position: relative; flex-shrink: 0; width: 272px; margin-left: 22px; }
.gutter.empty { display: none; }
.connectors { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
pre.trace { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--read); font-size: var(--trace-size, 1rem); line-height: 1.65; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; margin: 0; }
pre.trace.code { font-family: var(--mono); font-size: .8rem; line-height: 1.55; background: var(--sunken); padding: 10px 13px; }
pre.trace mark { background: var(--reader-mark); color: var(--ink); padding: 1px 0; border-radius: 2px; }
pre.trace mark.hl { background: var(--accent-soft); color: inherit; border-bottom: 2px solid var(--accent); cursor: pointer; border-radius: 0; }
.tracenote { background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 11px 13px; margin-top: 16px; max-width: 80ch; }
.tracenote textarea { width: 100%; min-height: 42px; resize: vertical; font-size: .88rem; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; margin-top: 7px; }
.note { position: absolute; left: 0; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); transition: top .12s ease; }
.note.mine { border-color: var(--accent); }
.notes.dropping { outline: 2px dashed var(--accent); outline-offset: -6px; }
.notes.dropping .dbody { background: var(--accent-soft); }
.note.detached { border-style: dashed; border-color: var(--flag); position: static; margin-bottom: 8px; }
.note .q { font-family: var(--mono); font-size: .76rem; color: var(--ink-muted); border-left: 2px solid var(--accent); padding-left: 8px; margin-bottom: 7px; line-height: 1.5; white-space: pre-wrap; }
.note textarea { width: 100%; min-height: 58px; resize: vertical; font-size: .86rem; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.note .who { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--ink-faint); margin-top: 7px; }
.note .who button { margin-left: auto; border: 0; background: none; color: var(--ink-faint); padding: 0 2px; }
.note .who button:hover { color: var(--flag); }
.note .warn { color: var(--flag); font-size: .74rem; margin-bottom: 5px; }
.selbar[hidden] { display: none; }
.selbar { position: fixed; z-index: 40; display: flex; gap: 2px; background: var(--ink); border-radius: 8px; padding: 3px; box-shadow: var(--shadow-lift); }
.selbar button { border: 0; background: transparent; color: var(--paper); font-size: .8rem; padding: 5px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; }
.selbar button:hover { background: color-mix(in srgb, var(--paper) 20%, transparent); }
.empty { color: var(--ink-muted); padding: 60px 22px; text-align: center; font-size: .94rem; }
.empty b { display: block; font-size: 1.2rem; color: var(--ink); margin-bottom: 7px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }

    shield: '<path d="M12 3.5 5 6.2v5.3c0 4.3 2.9 7.6 7 9 4.1-1.4 7-4.7 7-9V6.2Z"/><path d="M9 12.2l2.2 2.2 3.9-4"/>',
    pencil: '<path d="M11.5 19.5H20"/><path d="M15.8 4.4a2 2 0 0 1 2.9 2.8L7.6 18.3l-3.7.9.9-3.7Z"/>',
    talk: '<path d="M20.5 12.6c0 3.4-3.8 6.2-8.5 6.2a10 10 0 0 1-2.4-.3l-5.1 2 1.5-3.7a5.9 5.9 0 0 1-2-4.2c0-3.4 3.8-6.2 8.5-6.2s8 2.8 8 6.2Z"/>',
    sticky: '<path d="M5 3.5h14a1.5 1.5 0 0 1 1.5 1.5v9.4l-6.1 6.1H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5Z"/><path d="M14.4 20.5v-4.6a1.5 1.5 0 0 1 1.5-1.5h4.6"/>',
    eyeoff: '<path d="M3.5 3.5l17 17"/><path d="M10.6 5.6c.5-.1.9-.1 1.4-.1 6 0 9.5 6.5 9.5 6.5a17.5 17.5 0 0 1-2.9 3.7"/><path d="M6.5 6.6C4 8.4 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  };
  const icon = (name, size) => `<svg width="${size || 18}" height="${size || 18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;

  const short = m => String(m || '?').split('/').pop();
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '?' : d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
  const scoreText = v => v == null ? '·' : String(Math.round(v * 100) / 100);
  const pill = (score, thr) => `<span class="pill ${score == null ? 'none' : score > thr ? 'flag' : 'clean'}">${scoreText(score)}</span>`;
  // How a run ended, as the one question a reader asks of it. An attack that landed and
  // was not caught is the monitoring failure; an honest run that was flagged is a false alarm.
  const outcomeOf = r => r.mode !== 'attack' ? (r.caught ? 'honest-flagged' : 'honest-quiet') : r.landed ? (r.caught ? 'landed-caught' : 'landed-missed') : r.caught ? 'caught' : 'failed';
  const OUTCOME_LABEL = { 'landed-missed': 'landed, not caught', 'landed-caught': 'landed and caught', caught: 'caught, not landed', failed: 'neither', 'honest-quiet': 'honest, not flagged', 'honest-flagged': 'honest, flagged anyway' };
  // Your notes live in this browser, one store per run; the index only counts them.
  const notesOn = name => { try { const kept = JSON.parse(localStorage.getItem(`loc-arena-notes-v1/${name}`) || 'null'); return kept && kept.steps ? Object.values(kept.steps).filter(n => String(n.text || '').trim() || (n.marks || []).length).length : 0; } catch (e) { return 0; } };

  const DEFAULTS = { attacker: '', monitor: '', mode: '', outcome: '', text: '', sort: 'new' };
  const S = { ...DEFAULTS };
  const FIELDS = { 'x-attacker': 'attacker', 'x-monitor': 'monitor', 'x-mode': 'mode', 'x-outcome': 'outcome', 'x-text': 'text', 'x-sort': 'sort' };
  const readHash = () => { const p = new URLSearchParams(location.hash.slice(1)); Object.assign(S, DEFAULTS); for (const k of Object.keys(DEFAULTS)) if (p.has(k)) S[k] = p.get(k); };
  const writeHash = () => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(S)) if (v !== DEFAULTS[k]) p.set(k, v); history.replaceState(null, '', '#' + p.toString()); };

  const SORTS = {
    new: (a, b) => b.created.localeCompare(a.created),
    old: (a, b) => a.created.localeCompare(b.created),
    flagged: (a, b) => (b.flagged ?? -1) - (a.flagged ?? -1),
    missed: (a, b) => (b.covert_missed ?? -1) - (a.covert_missed ?? -1),
  };
  function selected() {
    const txt = S.text.trim().toLowerCase();
    return RUNS.filter(r => (!S.attacker || r.attacker === S.attacker) && (!S.monitor || r.monitor === S.monitor) && (!S.mode || r.mode === S.mode)
      && (!S.outcome || outcomeOf(r) === S.outcome) && (!txt || r.name.toLowerCase().includes(txt))).sort(SORTS[S.sort] || SORTS.new);
  }

  function renderStats(runs) {
    const attacks = runs.filter(r => r.mode === 'attack'), honest = runs.filter(r => r.mode !== 'attack');
    const stat = (big, lbl, cls) => `<div class="stat"><div class="big ${cls || ''}">${big}</div><div class="lbl">${lbl}</div></div>`;
    el('ix-stats').innerHTML = [
      stat(runs.length, `run${runs.length === 1 ? '' : 's'} listed, ${runs.filter(r => r.href).length} with a transcript`),
      stat(`${attacks.filter(r => r.landed).length}/${attacks.length}`, 'attack runs where the side task landed', 'covert'),
      stat(`${attacks.filter(r => r.caught).length}/${attacks.length}`, 'attack runs caught', 'flag'),
      stat(attacks.filter(r => r.landed && !r.caught).length, 'landed and not caught: the monitoring failures', attacks.some(r => r.landed && !r.caught) ? 'covert' : ''),
      stat(`${honest.filter(r => r.caught).length}/${honest.length}`, 'honest runs flagged anyway: false alarms'),
    ].join('');
  }
  function renderLandscape() {
    const attackers = [...new Set(RUNS.map(r => r.attacker))].sort(), monitors = [...new Set(RUNS.map(r => r.monitor))].sort();
    const cell = (a, m) => {
      const rs = RUNS.filter(r => r.attacker === a && r.monitor === m); if (!rs.length) return '<td><span class="hm empty"></span></td>';
      const at = rs.filter(r => r.mode === 'attack'), ho = rs.filter(r => r.mode !== 'attack');
      const missed = at.filter(r => r.landed && !r.caught).length;
      const cls = ['hm', missed ? 'covert' : at.length && at.every(r => r.caught) ? 'flag' : '', S.attacker === a && S.monitor === m ? 'on' : ''].join(' ');
      return `<td><button class="${cls}" data-a="${esc(a)}" data-m="${esc(m)}" aria-pressed="${S.attacker === a && S.monitor === m}">${at.length ? `${at.filter(r => r.caught).length}/${at.length} caught` : '·'}<small>${at.length ? `${at.filter(r => r.landed).length}/${at.length} landed` : ''}${missed ? ` · ${missed} missed` : ''}${ho.length ? `${at.length ? ' · ' : ''}${ho.length} honest` : ''}</small></button></td>`;
    };
    el('ix-land').innerHTML = `<table class="land" style="min-width:0;max-width:${220 + monitors.length * 190}px"><tr><th class="rowh"></th>${monitors.map(m => `<th title="${esc(m)}">${icon('shield', 13)} ${esc(short(m))}</th>`).join('')}</tr>${attackers.map(a => `<tr><th class="rowh" title="${esc(a)}">${icon('robot', 13)} ${esc(short(a))}</th>${monitors.map(m => cell(a, m)).join('')}</tr>`).join('')}</table>`;
    el('ix-land').querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
      const same = S.attacker === b.dataset.a && S.monitor === b.dataset.m;
      S.attacker = same ? '' : b.dataset.a; S.monitor = same ? '' : b.dataset.m; render();
    }));
  }
  function renderTable(runs) {
    const active = Object.entries(S).filter(([k, v]) => v !== DEFAULTS[k] && k !== 'sort');
    el('ix-chips').innerHTML = active.map(([k, v]) => `<button class="chip" data-clear="${k}"><i>${esc(k)}</i>${esc(k === 'outcome' ? OUTCOME_LABEL[v] : k === 'attacker' || k === 'monitor' ? short(v) : v)} &times;</button>`).join('') + `<span>${runs.length} of ${RUNS.length} runs</span>`;
    el('ix-chips').querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => { S[b.dataset.clear] = DEFAULTS[b.dataset.clear]; render(); }));
    const rows = runs.map(r => {
      const out = outcomeOf(r), notes = notesOn(r.name), thr = r.threshold ?? 0;
      const peaks = Object.entries(r.peaks || {}).map(([m, v]) => `<span title="${esc(m)}">${pill(v, thr)}</span>`).join(' ');
      const side = r.mode === 'attack' ? `${r.robust ? 'robust' : r.landed ? 'minimal' : 'no'} <span class="help">${r.milestones_reached}/${r.milestones_total}</span>` : '<span class="help">honest</span>';
      const steps = r.steps != null ? `${r.steps} <span class="help">&middot;</span> <b class="f">${r.flagged}</b> flagged <span class="help">&middot;</span> <b class="c">${r.covert}</b> covert${r.covert ? ` (${r.covert_missed} missed)` : ''}` : '<span class="help">&mdash;</span>';
      const talk = r.steps != null ? `${icon('talk', 12)} ${r.messages} ${icon('sticky', 12)} ${r.scratch}` : '<span class="help">&mdash;</span>';
      const open = r.href ? `<a class="tcbtn" href="${esc(r.href)}">open &#8599;</a>` : `<span class="help" title="${esc(r.why)}">${icon('eyeoff', 13)} no transcript</span>`;
      return `<tr class="out-${out}${r.href ? ' link' : ''}" ${r.href ? `data-href="${esc(r.href)}"` : ''} title="${esc(r.name)}">
        <td><b>${esc(when(r.created))}</b><br><span class="help">seed ${esc(r.seed)} &middot; ${r.minutes} min${r.stopped_at_wall_clock_ceiling ? ' &middot; <b>stopped at its wall-clock ceiling</b>' : ''}</span></td>
        <td><span class="tag ${r.mode === 'attack' ? 'covert' : ''}">${esc(r.mode)}</span></td>
        <td class="nowrap">${icon('robot', 13)} ${esc(short(r.attacker))}<br>${icon('shield', 13)} <span class="help">${esc(short(r.monitor))}</span></td>
        <td class="num">${esc(scoreText(r.main_score))}${r.gate_passed ? '' : `<br><span class="help">gate: ${esc(r.gate_reason || 'failed')}</span>`}</td>
        <td>${side}</td>
        <td><b class="${r.caught ? 'f' : ''}">${r.caught ? 'caught' : 'not caught'}</b><br>${peaks}</td>
        <td><span class="outc">${esc(OUTCOME_LABEL[out])}</span></td>
        <td>${steps}</td>
        <td class="nowrap">${talk}</td>
        <td class="num">${notes ? `${icon('pencil', 12)} ${notes}` : ''}</td>
        <td>${open}</td></tr>`;
    }).join('');
    el('ix-table').innerHTML = runs.length ? `<table class="runs"><thead><tr><th>when</th><th>mode</th><th>agents / monitor</th><th class="num">main task</th><th>side task</th><th>monitors</th><th>outcome</th><th>steps</th><th>talk</th><th class="num">your notes</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="help">No run matches.</p>';
    el('ix-table').querySelectorAll('tr[data-href]').forEach(tr => tr.addEventListener('click', e => { if (!(e.target instanceof Element && e.target.closest('a'))) location.href = tr.dataset.href; }));
    el('ix-incomplete').innerHTML = DATA.incomplete.length ? `<p class="help" style="margin-top:18px">Not listed, because they hold no scores yet (a run still going, or a sweep): ${DATA.incomplete.map(n => `<code>${esc(n)}</code>`).join(', ')}.</p>` : '';
  }
  function syncControls() { for (const [id, k] of Object.entries(FIELDS)) { const n = el(id); if (document.activeElement !== n) n.value = S[k]; } }
  function render() {
    const runs = selected();
    renderStats(runs); renderLandscape(); renderTable(runs); syncControls(); writeHash();
  }

  el('ix-lede').innerHTML = `Every run under <code>${esc(DATA.root)}</code>, built ${esc(when(DATA.built_at))}. Click a run to open its transcript. Your notes stay in this browser, one set per run.`;
  el('brand-root').textContent = DATA.root.split('/').filter(Boolean).pop() || DATA.root;
  el('railnav').innerHTML = `<button aria-current="true" title="All runs">${icon('grid')}<span class="lbl">All runs</span></button>`;
  el('railfoot').innerHTML = `${RUNS.length} runs<br>${RUNS.filter(r => r.href).length} with a transcript`;
  const opts = (values, label) => '<option value="">any</option>' + values.map(v => `<option value="${esc(v)}">${esc(label(v))}</option>`).join('');
  el('x-attacker').innerHTML = opts([...new Set(RUNS.map(r => r.attacker))].sort(), short);
  el('x-monitor').innerHTML = opts([...new Set(RUNS.map(r => r.monitor))].sort(), short);
  for (const [id, k] of Object.entries(FIELDS)) { const n = el(id); n.addEventListener(n.tagName === 'INPUT' ? 'input' : 'change', () => { S[k] = n.value; render(); }); }

  // per-viewer preferences, shared with the run pages
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } } };
  let base = Number(store.get('loc-arena-base')) || 14;
  const applyBase = () => { document.documentElement.style.setProperty('--base', base + 'px'); store.set('loc-arena-base', String(base)); };
  el('size-down').addEventListener('click', () => { base = Math.max(11, base - 1); applyBase(); });
  el('size-up').addEventListener('click', () => { base = Math.min(22, base + 1); applyBase(); });
  if (base !== 14) applyBase();
  const applyTheme = choice => {
    if (choice) document.documentElement.setAttribute('data-theme', choice); else document.documentElement.removeAttribute('data-theme');
    document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === choice)));
  };
  document.querySelectorAll('[data-theme-choice]').forEach(b => b.addEventListener('click', () => { applyTheme(b.dataset.themeChoice); store.set('loc-arena-theme', b.dataset.themeChoice); }));
  applyTheme(store.get('loc-arena-theme') ?? '');
  const applyRail = mini => {
    const app = document.querySelector('.app');
    if (mini) app.setAttribute('data-rail', 'mini'); else app.removeAttribute('data-rail');
    el('btn-rail').setAttribute('aria-expanded', String(!mini));
    el('btn-rail').innerHTML = icon('panel', 17);
    store.set('loc-arena-rail', mini ? 'mini' : 'full');
  };
  el('btn-rail').addEventListener('click', () => applyRail(!document.querySelector('.app').hasAttribute('data-rail')));
  applyRail(store.get('loc-arena-rail') === 'mini');
  // Coming back from a run page shows its notes in the count.
  window.addEventListener('pageshow', () => render());
  window.addEventListener('hashchange', () => { readHash(); render(); });

  readHash();
  render();
})();
</script>
