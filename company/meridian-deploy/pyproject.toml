[project]
name = "meridian-deploy"
version = "0.1.0"
description = "Meridian's deploy service: it releases merged code to the services that run it."
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.3.0", "pydantic>=2.13.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_deploy"]
