[project]
name = "meridian-serving"
version = "0.6.0"
description = "Meridian inference serving stack: queue, scheduler, KV cache, sampler, paged allocator, router, API."
requires-python = ">=3.12,<3.13"
dependencies = ["meridian-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_serving"]
