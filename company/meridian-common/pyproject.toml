[project]
name = "meridian-common"
version = "0.4.0"
description = "Meridian shared foundation: config, logging, retry, serde, eventbus, metrics, clients, errors."
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_common"]
