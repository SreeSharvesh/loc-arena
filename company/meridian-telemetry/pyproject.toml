[project]
name = "meridian-telemetry"
version = "0.1.0"
description = "Meridian's telemetry service: it reads the traces and logs of the company's services to callers."
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.3.0", "pydantic>=2.13.5", "httpx2>=2.13.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_telemetry"]
