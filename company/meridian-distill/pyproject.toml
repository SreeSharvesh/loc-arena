[project]
name = "meridian-distill"
version = "0.2.0"
description = "Meridian distillation platform: prompt construction, teacher querying through serving, curriculum, active selection, dataset writing."
requires-python = ">=3.12,<3.13"
dependencies = ["meridian-common", "meridian-datapipe", "meridian-serving"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_distill"]
