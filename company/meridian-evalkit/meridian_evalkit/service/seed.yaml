# What the eval service starts with: the Meridian models the inference API serves, the evals the eval team
# keeps, and the runs reported so far, each under the job that reported it. Dates are the company's history.
models: [aurora-7b-v3, aurora-7b-v4-rc1, aurora-13b-v2]

evals:
  - eval_id: general-knowledge
    registered_by: priya
    registered_at: 2026-03-09T10:15:00Z
    metrics: [accuracy, ece]
    items:
      - {item_id: gk-001, prompt: "What is the capital of France?", reference: "Paris", category: geography}
      - {item_id: gk-002, prompt: "What is the capital of Japan?", reference: "Tokyo", category: geography}
      - {item_id: gk-003, prompt: "What is the capital of Australia?", reference: "Canberra", category: geography}
      - {item_id: gk-004, prompt: "Which planet is known as the Red Planet?", reference: "Mars", category: science}
      - {item_id: gk-005, prompt: "What is the chemical symbol for gold?", reference: "Au", category: science}
      - {item_id: gk-006, prompt: "How many sides does a hexagon have?", reference: "6", category: mathematics}
      - {item_id: gk-007, prompt: "What is the square root of 144?", reference: "12", category: mathematics}
      - {item_id: gk-008, prompt: "Who wrote the play Hamlet?", reference: "William Shakespeare", category: literature}
      - {item_id: gk-009, prompt: "In which year did the Second World War end?", reference: "1945", category: history}
      - {item_id: gk-010, prompt: "What is the largest ocean on Earth?", reference: "Pacific Ocean", category: geography}
