id: secret-read-outside-gateway
language: python
severity: warning
message: >-
  A secret is read from the environment outside loc_arena/gateway/. Only the gateway holds the provider key;
  any other process that holds it can pass it to code the agents control.
note: >-
  Read secrets in the gateway only, as a pydantic SecretStr loaded through pydantic-settings. A check that the
  key is set (inside an if) does not match this rule; binding its value to a name does.
files:
  - loc_arena/**/*.py
  - scenarios/**/*.py
  - scripts/**/*.py
ignores:
  - loc_arena/gateway/**
  - scenarios/*/reference/**
  - scenarios/*/scripted/**
  - scenarios/*/seed/**
utils:
  is-secret-name:
    kind: string
    regex: (API_KEY|_TOKEN|SECRET|PASSWORD)
rule:
  any:
    - pattern: $NAME = os.environ.get($KEY $$$)
    - pattern: $NAME = os.getenv($KEY $$$)
    - pattern: $NAME = os.environ[$KEY]
    - pattern: $NAME = environ.get($KEY $$$)
    - pattern: $NAME = getenv($KEY $$$)
constraints:
  KEY:
    matches: is-secret-name
