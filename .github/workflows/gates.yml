# The gates on Linux, Docker tests included. No secrets: the Docker tests bring the stack up with a random
# placeholder key, and the live tests skip without LOC_ARENA_LIVE.
name: gates

on:
  pull_request:
  push:
    branches: [main]

env:
  FILE_SIZE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-size:
    name: file size (700 lines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/check_file_size.py --base "$FILE_SIZE_BASE"

  gates:
    name: ruff, ty, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12" # pyproject: requires-python >=3.12,<3.13
          enable-cache: true

      - run: uv sync --locked

      # The Docker tests skip unless these images exist; the names are settings.stack.sandbox_image and .image.
      - run: docker build --pull --target sandbox -t loc-arena-sandbox:latest .
      - run: docker build --pull -t loc-arena:latest .

      - run: make gates
