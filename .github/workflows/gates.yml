# The gates on Linux, Docker tests included. No secrets: the Docker tests bring the stack up with a random
# placeholder key, and the live tests skip without LOC_ARENA_LIVE.
name: gates

on:
  pull_request:
  push:
    branches: [main]

env:
  FILE_SIZE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  # The pull request under check must hold the changelog's top release; empty on a push to main.
  CHANGELOG_PULL_REQUEST: ${{ github.event.pull_request.number }}

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: integration tests, try ${{ matrix.try }} (spike)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run pytest -q -n auto --dist loadscope -m "not stack" tests/integration -k scorer
