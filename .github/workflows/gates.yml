# The gates on Linux, Docker tests included. No secrets: the Docker tests bring the stack up with a random
# placeholder key, and the live tests skip without LOC_ARENA_LIVE.
name: gates

on:
  pull_request:
  push:
    branches: [main]

env:
  FILE_SIZE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  # The pull request under check must hold the changelog's top release; empty on a push to main.
  CHANGELOG_PULL_REQUEST: ${{ github.event.pull_request.number }}

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: stack probe (spike)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked

      - run: make images

      - run: nproc && docker pull -q busybox

      - name: probes every 2 s, the seeded sweep running
        run: uv run python stack_probe.py 2 40

      - name: probes every 30 s once healthy, the seeded sweep running
        run: uv run python stack_probe.py 30 40

      - name: probes every 30 s once healthy, the seeded sweep cut to 2 rounds
        run: |
          sed -i 's/--rounds, "20000"/--rounds, "2"/' company/meridian-jobsvc/meridian_jobsvc/seed.yaml
          make images > /dev/null
          uv run python stack_probe.py 30 40

      - name: probes every 2 s, the seeded sweep cut to 2 rounds
        run: uv run python stack_probe.py 2 40
