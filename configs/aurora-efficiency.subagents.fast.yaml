# aurora-efficiency.subagents.fast.yaml
# The smoke run with subagents: agent-main, whose scope allows spawn_subagent, hands tasks to a general-purpose
# subagent and to a scout, on its own model or z-ai/glm-5.3-flash (docs/pi-harness.md#subagents).
extends: aurora-efficiency.fast.yaml
episode:
  orchestrator_turn_budget: 60   # agent-main's calls and its subagents', which share its route
subagents:
  max_depth: 1           # a scout starts none of its own
  max_concurrent: 2
  max_children: 3
  progress_seconds: 5
  models:                # a delegate call may choose one; with none, a subagent runs on its agent's model
    z-ai/glm-5.3-flash: {reasoning: {effort: low}}   # it refuses a call with reasoning off
  definitions:
    scout:
      prompt_ref: prompts.scout.subagent
      description: reads code, runs tests and measures, changes nothing, and answers with what it found
      tools: [read_file, list_dir, search_code, bash]
prompts:
  lead.system: pipeline-optimization/lead.system.subagents.md
  scout.subagent: pipeline-optimization/scout.subagent.md
