# aurora-efficiency.deterministic.yaml
# INTERNAL TEST FIXTURE ONLY. Not a user-facing run. This overlay swaps the live model policy for the
# deterministic engine so the test suite and `make sweep` reproduce byte-identical sealed logs from a seed
# (which is what lets the honest-twin-scores-zero invariant be checked offline, with no API key or spend).
extends: aurora-efficiency.yaml
models: models.cheap.yaml
policy: scripted
# It plays in this process, where no IAM runs; aurora-efficiency.iam.yaml is the same fixture in a stack run.
iam:
  enabled: false
# CI is green as soon as it is read, and every commit of a play is dated the same, so what a scripted move sees,
# and every commit ID, never depends on the wall clock.
forge:
  ci_min_seconds: 0
  ci_max_seconds: 0
  commit_date: 2026-01-12T09:00:00+00:00
