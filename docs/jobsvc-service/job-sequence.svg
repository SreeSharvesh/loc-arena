<svg xmlns="http://www.w3.org/2000/svg" width="824" height="744" viewBox="0 0 824 744" role="img" aria-label="UML sequence diagram of one job: the submitter calls submit_job; the job service has IAM authorize the call and issue the job a workload; then a node runs the job with its own secrets; the job calls a service, which IAM authorizes as the job's principal; and the job calls the model gateway with the node's token">
<style>
  svg { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; --panel:#f6f8fa;
        --accent:#2f4bd6; --accent-bg:#e9edfd;
        --sealed:#0d9488; --sealed-bg:#d9f2ef; --observe:#b3730a; --observe-bg:#f8ecd5; --attack:#d63f4a; --attack-bg:#fbe3e4; }
  @media (prefers-color-scheme: dark) {
    svg { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; --panel:#161b22;
          --accent:#8098ff; --accent-bg:#1b2340;
          --sealed:#3ad6c4; --sealed-bg:#12312e; --observe:#e0a94a; --observe-bg:#33280f; --attack:#f47b82; --attack-bg:#3a1c20; }
  }
  text { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  .box { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .focus { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
  .ext { fill:none; stroke:var(--rule); stroke-width:1.25; stroke-dasharray:5 4; }
  .region { fill:none; stroke:var(--rule); stroke-width:1; }
  .sealed { fill:var(--sealed-bg); stroke:var(--sealed); stroke-width:1.5; }
  .observe { fill:var(--observe-bg); stroke:var(--observe); stroke-width:1.5; }
  .attack { fill:var(--attack-bg); stroke:var(--attack); stroke-width:1.5; }
  .t { fill:var(--ink); font-size:13px; font-weight:600; }
  .s { fill:var(--muted); font-size:11px; }
  .m { fill:var(--muted); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .bold { stroke:var(--ink); stroke-width:2.5; fill:none; }
  .thin { stroke:var(--rule); stroke-width:1.25; fill:none; }
  .dash { stroke:var(--rule); stroke-width:1.25; fill:none; stroke-dasharray:4 3; }
  .life { stroke:var(--rule); stroke-width:1; fill:none; stroke-dasharray:3 4; }
  .note { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .act { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .frame { fill:none; stroke:var(--rule); stroke-width:1; }
  .ring { fill:none; stroke:var(--ink); stroke-width:1.5; }
  .head-ink { fill:var(--ink); } .head-rule { fill:var(--rule); } .dot { fill:var(--ink); }
</style>
<defs>
  <marker id="hi" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="hr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-rule" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<g class="node"><rect class="box" x="12.0" y="24" width="104" height="48" rx="6"/><text class="t" x="64.0" y="40.0" text-anchor="middle" dominant-baseline="central">Submitter</text><text class="s" x="64.0" y="57.0" text-anchor="middle" dominant-baseline="central">agent or job</text></g>
<g class="node"><rect class="focus" x="156.0" y="24" width="104" height="48" rx="6"/><text class="t" x="208.0" y="40.0" text-anchor="middle" dominant-baseline="central">Job service</text><text class="m" x="208.0" y="57.0" text-anchor="middle" dominant-baseline="central">jobsvc</text></g>
<g class="node"><rect class="box" x="316.0" y="24" width="104" height="48" rx="6"/><text class="t" x="368.0" y="40.0" text-anchor="middle" dominant-baseline="central">Access control</text><text class="m" x="368.0" y="57.0" text-anchor="middle" dominant-baseline="central">meridian-iam</text></g>
<g class="node"><rect class="box" x="452.0" y="24" width="104" height="48" rx="6"/><text class="t" x="504.0" y="40.0" text-anchor="middle" dominant-baseline="central">A service</text><text class="s" x="504.0" y="57.0" text-anchor="middle" dominant-baseline="central">e.g. notes</text></g>
<g class="node"><rect class="box" x="580.0" y="24" width="104" height="48" rx="6"/><text class="t" x="632.0" y="40.0" text-anchor="middle" dominant-baseline="central">A node</text><text class="m" x="632.0" y="57.0" text-anchor="middle" dominant-baseline="central">node-1</text></g>
<g class="node"><rect class="ext" x="708.0" y="24" width="104" height="48" rx="6"/><text class="t" x="760.0" y="40.0" text-anchor="middle" dominant-baseline="central">Model gateway</text><text class="m" x="760.0" y="57.0" text-anchor="middle" dominant-baseline="central">gateway</text></g>
<path class="life" d="M64 72 V728"/>
<path class="life" d="M208 72 V728"/>
<path class="life" d="M368 72 V728"/>
<path class="life" d="M504 72 V728"/>
<path class="life" d="M760 72 V728"/>
<path class="life" d="M632 72 V456"/>
<path class="life" d="M632 696 V728"/>
<g class="node"><rect class="act" x="627" y="456" width="10" height="240"/></g>
<path class="bold" d="M64 120 H207" marker-end="url(#hi)"/>
<text x="136.0" y="90" text-anchor="middle" dominant-baseline="central"><tspan class="m">1 submit_job</tspan></text>
<text x="136.0" y="105" text-anchor="middle" dominant-baseline="central"><tspan class="s">its credential</tspan></text>
<path class="thin" d="M208 168 H367" marker-end="url(#hr)"/>
<text x="288.0" y="138" text-anchor="middle" dominant-baseline="central"><tspan class="m">2 authorize</tspan></text>
<text x="288.0" y="153" text-anchor="middle" dominant-baseline="central"><tspan class="s">may it submit?</tspan></text>
<path class="thin" d="M208 216 H367" marker-end="url(#hr)"/>
<text x="288.0" y="186" text-anchor="middle" dominant-baseline="central"><tspan class="m">3 delegable</tspan></text>
<text x="288.0" y="201" text-anchor="middle" dominant-baseline="central"><tspan class="s">what it holds now</tspan></text>
<path class="dash" d="M368 264 H209" marker-end="url(#hr)"/>
<text x="288.0" y="249" text-anchor="middle" dominant-baseline="central"><tspan class="s">grants to copy</tspan></text>
<path class="bold" d="M208 312 H367" marker-end="url(#hi)"/>
<text x="288.0" y="282" text-anchor="middle" dominant-baseline="central"><tspan class="m">4 issue_workload</tspan></text>
<text x="288.0" y="297" text-anchor="middle" dominant-baseline="central"><tspan class="s">a new secret per service</tspan></text>
<path class="dash" d="M368 360 H209" marker-end="url(#hr)"/>
<text x="288.0" y="345" text-anchor="middle" dominant-baseline="central"><tspan class="s">principal </tspan><tspan class="m">job-&lt;id&gt;</tspan></text>
<path class="dash" d="M208 408 H65" marker-end="url(#hr)"/>
<text x="136.0" y="393" text-anchor="middle" dominant-baseline="central"><tspan class="s">5 job, </tspan><tspan class="m">pending</tspan></text>
<path class="bold" d="M208 456 H626" marker-end="url(#hi)"/>
<text x="288.0" y="426" text-anchor="middle" dominant-baseline="central"><tspan class="m">6 POST /jobs</tspan></text>
<text x="288.0" y="441" text-anchor="middle" dominant-baseline="central"><tspan class="s">its secrets in the env</tspan></text>
<path class="bold" d="M627 504 H505" marker-end="url(#hi)"/>
<text x="565.5" y="474" text-anchor="middle" dominant-baseline="central"><tspan class="s">7 its own secret</tspan></text>
<text x="565.5" y="489" text-anchor="middle" dominant-baseline="central"><tspan class="m">MERIDIAN_*_TOKEN</tspan></text>
<path class="bold" d="M504 552 H369" marker-end="url(#hi)"/>
<text x="436.0" y="522" text-anchor="middle" dominant-baseline="central"><tspan class="m">8 authorize</tspan></text>
<text x="436.0" y="537" text-anchor="middle" dominant-baseline="central"><tspan class="s">as </tspan><tspan class="m">job-&lt;id&gt;</tspan></text>
<path class="thin" d="M637 600 H759" marker-end="url(#hr)"/>
<text x="698.5" y="570" text-anchor="middle" dominant-baseline="central"><tspan class="s">9 model call</tspan></text>
<text x="698.5" y="585" text-anchor="middle" dominant-baseline="central"><tspan class="s">the node's token</tspan></text>
<path class="thin" d="M208 648 H626" marker-end="url(#hr)"/>
<text x="288.0" y="618" text-anchor="middle" dominant-baseline="central"><tspan class="m">10 GET /status</tspan></text>
<text x="288.0" y="633" text-anchor="middle" dominant-baseline="central"><tspan class="s">on each pass</tspan></text>
<path class="dash" d="M627 696 H209" marker-end="url(#hr)"/>
<text x="288.0" y="681" text-anchor="middle" dominant-baseline="central"><tspan class="s">exited 0: </tspan><tspan class="m">succeeded</tspan></text>
</svg>
