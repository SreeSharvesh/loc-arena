<svg xmlns="http://www.w3.org/2000/svg" width="640" height="464" viewBox="0 0 640 464" role="img" aria-label="State diagram of a ticket: create_ticket files it open, and edit_ticket with a status moves it between open, in progress and closed in any order; there is no end state">
<style>
  svg { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; --panel:#f6f8fa;
        --accent:#2f4bd6; --accent-bg:#e9edfd; }
  @media (prefers-color-scheme: dark) {
    svg { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; --panel:#161b22;
          --accent:#8098ff; --accent-bg:#1b2340; }
  }
  text { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  .box { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .t { fill:var(--ink); font-size:13px; font-weight:600; }
  .s { fill:var(--muted); font-size:11px; }
  .m { fill:var(--muted); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .bold { stroke:var(--ink); stroke-width:2.5; fill:none; }
  .thin { stroke:var(--rule); stroke-width:1.25; fill:none; }
  .head-ink { fill:var(--ink); } .head-rule { fill:var(--rule); } .dot { fill:var(--ink); }
</style>
<defs>
  <marker id="ts-hi" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ts-hr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-rule" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- start: create_ticket files a ticket open -->
<g class="node"><circle class="dot" cx="320" cy="24" r="7"/></g>
<path class="bold" d="M320 31 V78" marker-end="url(#ts-hi)"/>
<text class="m" x="332" y="58">create_ticket</text>

<!-- states -->
<g class="node"><rect class="box" x="248" y="80" width="144" height="48" rx="14"/>
  <text class="t" x="320" y="97" text-anchor="middle" dominant-baseline="central">Open</text>
  <text class="m" x="320" y="115" text-anchor="middle" dominant-baseline="central">open</text></g>
<g class="node"><rect class="box" x="248" y="224" width="144" height="48" rx="14"/>
  <text class="t" x="320" y="241" text-anchor="middle" dominant-baseline="central">In progress</text>
  <text class="m" x="320" y="259" text-anchor="middle" dominant-baseline="central">in_progress</text></g>
<g class="node"><rect class="box" x="248" y="368" width="144" height="48" rx="14"/>
  <text class="t" x="320" y="385" text-anchor="middle" dominant-baseline="central">Closed</text>
  <text class="m" x="320" y="403" text-anchor="middle" dominant-baseline="central">closed</text></g>

<!-- open <-> in_progress -->
<path class="bold" d="M304 128 V222" marker-end="url(#ts-hi)"/>
<text class="m" x="294" y="180" text-anchor="end">status=in_progress</text>
<path class="thin" d="M336 224 V129" marker-end="url(#ts-hr)"/>
<text class="m" x="346" y="180">status=open</text>

<!-- in_progress <-> closed -->
<path class="bold" d="M304 272 V366" marker-end="url(#ts-hi)"/>
<text class="m" x="294" y="324" text-anchor="end">status=closed</text>
<path class="thin" d="M336 368 V273" marker-end="url(#ts-hr)"/>
<text class="m" x="346" y="324">status=in_progress</text>

<!-- open <-> closed -->
<path class="thin" d="M248 104 H136 V392 H247" marker-end="url(#ts-hr)"/>
<text class="m" x="126" y="252" text-anchor="end">status=closed</text>
<path class="thin" d="M392 392 H504 V104 H393" marker-end="url(#ts-hr)"/>
<text class="m" x="514" y="252">status=open</text>

<text class="s" x="320" y="448" text-anchor="middle">Every arrow between states is edit_ticket with that status.</text>
</svg>
