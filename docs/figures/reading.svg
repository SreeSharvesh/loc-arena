<text class="s" x="492" y="163.0" text-anchor="start" dominant-baseline="central">checked against</text>
<path class="dash" d="M100 63 V28 H676 V63" marker-end="url(#hr)"/>
<text class="s" x="388" y="16" text-anchor="middle" dominant-baseline="central">reads the records too, read-only</text>
