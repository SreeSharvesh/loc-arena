<svg xmlns="http://www.w3.org/2000/svg" width="800" height="904" viewBox="0 0 800 904" role="img" aria-label="Data flow of attribution: a bound turn tags every append to the sealed and mirror logs; the finished trace and the sealed log give each event its lane; the Inspect log holds one span per agent and turn; the transcript gives each lane a column.">
<style>
  svg { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; --panel:#f6f8fa;
        --accent:#2f4bd6; --accent-bg:#e9edfd;
        --sealed:#0d9488; --sealed-bg:#d9f2ef; --observe:#b3730a; --observe-bg:#f8ecd5; --attack:#d63f4a; --attack-bg:#fbe3e4; }
  @media (prefers-color-scheme: dark) {
    svg { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; --panel:#161b22;
          --accent:#8098ff; --accent-bg:#1b2340;
          --sealed:#3ad6c4; --sealed-bg:#12312e; --observe:#e0a94a; --observe-bg:#33280f; --attack:#f47b82; --attack-bg:#3a1c20; }
  }
  text { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  .box { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .focus { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
  .ext { fill:none; stroke:var(--rule); stroke-width:1.25; stroke-dasharray:5 4; }
  .region { fill:none; stroke:var(--rule); stroke-width:1; }
  .sealed { fill:var(--sealed-bg); stroke:var(--sealed); stroke-width:1.5; }
  .observe { fill:var(--observe-bg); stroke:var(--observe); stroke-width:1.5; }
  .attack { fill:var(--attack-bg); stroke:var(--attack); stroke-width:1.5; }
  .t { fill:var(--ink); font-size:13px; font-weight:600; }
  .s { fill:var(--muted); font-size:11px; }
  .m { fill:var(--muted); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .bold { stroke:var(--ink); stroke-width:2.5; fill:none; }
  .thin { stroke:var(--rule); stroke-width:1.25; fill:none; }
  .dash { stroke:var(--rule); stroke-width:1.25; fill:none; stroke-dasharray:4 3; }
  .life { stroke:var(--rule); stroke-width:1; fill:none; stroke-dasharray:3 4; }
  .head-ink { fill:var(--ink); } .head-rule { fill:var(--rule); } .dot { fill:var(--ink); }
</style>
<defs>
  <marker id="hi" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="hr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-rule" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<g class="node"><rect class="box" x="232" y="24" width="320" height="72" rx="14"/><text class="t" x="392.0" y="44" text-anchor="middle" dominant-baseline="central">Play one turn at a time</text><text class="m" x="392.0" y="61" text-anchor="middle" dominant-baseline="central">Agent.run_turn</text><text class="s" x="392.0" y="77" text-anchor="middle" dominant-baseline="central">binds trace.turn; turns never nest</text></g>
<g class="node"><rect class="box" x="600" y="24" width="176" height="72" rx="14"/><text class="t" x="688.0" y="44" text-anchor="middle" dominant-baseline="central">Tag each append</text><text class="m" x="688.0" y="61" text-anchor="middle" dominant-baseline="central">AgentTrace</text><text class="s" x="688.0" y="77" text-anchor="middle" dominant-baseline="central">the bound turn, or World</text></g>
<path class="bold" d="M552 60 H599" marker-end="url(#hi)"/>
<text class="s" x="576.0" y="46" text-anchor="middle" dominant-baseline="central">binds</text>
<rect class="region" x="232" y="144" width="320" height="120" rx="6"/>
<text class="t" x="244" y="160" text-anchor="start" dominant-baseline="central">Event logs</text>
<g class="node"><path class="sealed" d="M244 182 V242 A72.0 6 0 0 0 388.0 242 V182 A72.0 6 0 0 0 244 182 Z"/><path class="sealed" style="fill:none" d="M244 182 A72.0 6 0 0 0 388.0 182"/><text class="t" x="316.0" y="202" text-anchor="middle" dominant-baseline="central">Sealed log</text><text class="m" x="316.0" y="219" text-anchor="middle" dominant-baseline="central">events.sealed.jsonl</text><text class="s" x="316.0" y="235" text-anchor="middle" dominant-baseline="central">sealed ground truth</text></g>
<g class="node"><path class="observe" d="M396.0 182 V242 A72.0 6 0 0 0 540.0 242 V182 A72.0 6 0 0 0 396.0 182 Z"/><path class="observe" style="fill:none" d="M396.0 182 A72.0 6 0 0 0 540.0 182"/><text class="t" x="468.0" y="202" text-anchor="middle" dominant-baseline="central">Mirror log</text><text class="m" x="468.0" y="219" text-anchor="middle" dominant-baseline="central">events.mirror.jsonl</text><text class="s" x="468.0" y="235" text-anchor="middle" dominant-baseline="central">observable record</text></g>
<g class="node"><rect class="box" x="24" y="168" width="160" height="88" rx="14"/><text class="t" x="104.0" y="188" text-anchor="middle" dominant-baseline="central">Build from records</text><text class="m" x="104.0" y="205" text-anchor="middle" dominant-baseline="central">build_recorded_events</text><text class="s" x="104.0" y="221" text-anchor="middle" dominant-baseline="central">after play; not tagged</text><text class="s" x="104.0" y="237" text-anchor="middle" dominant-baseline="central">turn from the trace&#x27;s times</text></g>
<path class="thin" d="M184 212 H231" marker-end="url(#hr)"/>
<path class="thin" d="M392.0 96 V143" marker-end="url(#hr)"/>
<text class="s" x="400.0" y="120" text-anchor="start" dominant-baseline="central">appends</text>
<path class="thin" d="M552 188 H648 V97" marker-end="url(#hr)"/>
<text class="s" x="656" y="132" text-anchor="start" dominant-baseline="central">on_append</text>
<g class="node"><path class="box" d="M600 318 V378 A88.0 6 0 0 0 776 378 V318 A88.0 6 0 0 0 600 318 Z"/><path class="box" style="fill:none" d="M600 318 A88.0 6 0 0 0 776 318"/><text class="t" x="688.0" y="338" text-anchor="middle" dominant-baseline="central">Per-agent trace</text><text class="m" x="688.0" y="355" text-anchor="middle" dominant-baseline="central">EpisodeTrace</text><text class="s" x="688.0" y="371" text-anchor="middle" dominant-baseline="central">boundary: last sealed seq</text></g>
<path class="bold" d="M728 96 V311" marker-end="url(#hi)"/>
<text class="s" x="736" y="200" text-anchor="start" dominant-baseline="central">finish</text>
<g class="node"><rect class="box" x="232" y="432" width="320" height="72" rx="14"/><text class="t" x="392.0" y="452" text-anchor="middle" dominant-baseline="central">Give each event a lane</text><text class="m" x="392.0" y="469" text-anchor="middle" dominant-baseline="central">inspect_export._lanes_for</text><text class="s" x="392.0" y="485" text-anchor="middle" dominant-baseline="central">else World; an unlaned seq ≤ boundary raises</text></g>
<path class="thin" d="M316.0 248 V431" marker-end="url(#hr)"/>
<text class="s" x="308.0" y="324" text-anchor="end" dominant-baseline="central">&gt; boundary:</text>
<text class="s" x="308.0" y="340" text-anchor="end" dominant-baseline="central">(actor_uid, turn)</text>
<text class="s" x="308.0" y="356" text-anchor="end" dominant-baseline="central">if a native turn</text>
<path class="bold" d="M688.0 384 V468 H553" marker-end="url(#hi)"/>
<text class="s" x="696.0" y="412" text-anchor="start" dominant-baseline="central">≤ boundary:</text>
<text class="s" x="696.0" y="428" text-anchor="start" dominant-baseline="central">the turn bound</text>
<g class="node"><path class="box" d="M232 558 V618 A160.0 6 0 0 0 552 618 V558 A160.0 6 0 0 0 232 558 Z"/><path class="box" style="fill:none" d="M232 558 A160.0 6 0 0 0 552 558"/><text class="t" x="392.0" y="578" text-anchor="middle" dominant-baseline="central">Inspect log</text><text class="m" x="392.0" y="595" text-anchor="middle" dominant-baseline="central">&lt;run_name&gt;.eval</text><text class="s" x="392.0" y="611" text-anchor="middle" dominant-baseline="central">episode › agent › turn spans; World in root</text></g>
<path class="bold" d="M392.0 504 V551" marker-end="url(#hi)"/>
<g class="node"><rect class="box" x="232" y="672" width="320" height="88" rx="14"/><text class="t" x="392.0" y="692" text-anchor="middle" dominant-baseline="central">Lay out the transcript</text><text class="m" x="392.0" y="709" text-anchor="middle" dominant-baseline="central">transcript_lanes.build_transcript</text><text class="s" x="392.0" y="725" text-anchor="middle" dominant-baseline="central">a turn span → its agent&#x27;s column; else World</text><text class="s" x="392.0" y="741" text-anchor="middle" dominant-baseline="central">a verdict → the row of its mirror_seq</text></g>
<path class="bold" d="M392.0 624 V671" marker-end="url(#hi)"/>
<g class="node"><path class="box" d="M232 814 V874 A160.0 6 0 0 0 552 874 V814 A160.0 6 0 0 0 232 814 Z"/><path class="box" style="fill:none" d="M232 814 A160.0 6 0 0 0 552 814"/><text class="t" x="392.0" y="834" text-anchor="middle" dominant-baseline="central">Transcript</text><text class="m" x="392.0" y="851" text-anchor="middle" dominant-baseline="central">transcript.html · transcript.txt</text><text class="s" x="392.0" y="867" text-anchor="middle" dominant-baseline="central">one column per lane, one row per round</text></g>
<path class="bold" d="M392.0 760 V807" marker-end="url(#hi)"/>
</svg>
