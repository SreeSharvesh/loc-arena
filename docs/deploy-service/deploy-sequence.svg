<svg xmlns="http://www.w3.org/2000/svg" width="864" height="600" viewBox="0 0 864 600" role="img" aria-label="UML sequence diagram of a deployment. An agent calls deploy for the notes service. The deploy service has IAM issue the deployment a workload that may read the forge, fetches each repo's main from the forge as that workload, and hands the release to the supervisor in the service's container. The supervisor starts the service's process again on the release, and once it answers on its port tells the deploy service it serves, which returns the deployment to the agent.">
<style>
  svg { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; --panel:#f6f8fa;
        --accent:#2f4bd6; --accent-bg:#e9edfd;
        --sealed:#0d9488; --sealed-bg:#d9f2ef; --observe:#b3730a; --observe-bg:#f8ecd5; --attack:#d63f4a; --attack-bg:#fbe3e4; }
  @media (prefers-color-scheme: dark) {
    svg { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; --panel:#161b22;
          --accent:#8098ff; --accent-bg:#1b2340;
          --sealed:#3ad6c4; --sealed-bg:#12312e; --observe:#e0a94a; --observe-bg:#33280f; --attack:#f47b82; --attack-bg:#3a1c20; }
  }
  text { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  .box { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .focus { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
  .ext { fill:none; stroke:var(--rule); stroke-width:1.25; stroke-dasharray:5 4; }
  .region { fill:none; stroke:var(--rule); stroke-width:1; }
  .sealed { fill:var(--sealed-bg); stroke:var(--sealed); stroke-width:1.5; }
  .observe { fill:var(--observe-bg); stroke:var(--observe); stroke-width:1.5; }
  .attack { fill:var(--attack-bg); stroke:var(--attack); stroke-width:1.5; }
  .t { fill:var(--ink); font-size:13px; font-weight:600; }
  .s { fill:var(--muted); font-size:11px; }
  .m { fill:var(--muted); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .bold { stroke:var(--ink); stroke-width:2.5; fill:none; }
  .thin { stroke:var(--rule); stroke-width:1.25; fill:none; }
  .dash { stroke:var(--rule); stroke-width:1.25; fill:none; stroke-dasharray:4 3; }
  .life { stroke:var(--rule); stroke-width:1; fill:none; stroke-dasharray:3 4; }
  .head-ink { fill:var(--ink); } .head-rule { fill:var(--rule); } .dot { fill:var(--ink); }
</style>
<defs>
  <marker id="ds-hi" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ds-hr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-rule" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<g class="node"><rect class="box" x="16" y="24" width="112" height="48" rx="6"/><text class="t" x="72" y="40" text-anchor="middle" dominant-baseline="central">Agent</text><text class="s" x="72" y="57" text-anchor="middle" dominant-baseline="central">its tool call</text></g>
<g class="node"><rect class="focus" x="152" y="24" width="144" height="48" rx="6"/><text class="t" x="224" y="40" text-anchor="middle" dominant-baseline="central">Deploy service</text><text class="m" x="224" y="57" text-anchor="middle" dominant-baseline="central">deploy</text></g>
<g class="node"><rect class="box" x="320" y="24" width="112" height="48" rx="6"/><text class="t" x="376" y="40" text-anchor="middle" dominant-baseline="central">IAM</text><text class="s" x="376" y="57" text-anchor="middle" dominant-baseline="central">decides, issues</text></g>
<g class="node"><rect class="box" x="456" y="24" width="112" height="48" rx="6"/><text class="t" x="512" y="40" text-anchor="middle" dominant-baseline="central">Forge</text><text class="m" x="512" y="57" text-anchor="middle" dominant-baseline="central">main</text></g>
<g class="node"><rect class="box" x="592" y="24" width="128" height="48" rx="6"/><text class="t" x="656" y="40" text-anchor="middle" dominant-baseline="central">Supervisor</text><text class="s" x="656" y="57" text-anchor="middle" dominant-baseline="central">service's container</text></g>
<g class="node"><rect class="box" x="744" y="24" width="96" height="48" rx="6"/><text class="t" x="792" y="40" text-anchor="middle" dominant-baseline="central">Service</text><text class="s" x="792" y="57" text-anchor="middle" dominant-baseline="central">its process</text></g>
<path class="life" d="M72 72 V576"/>
<path class="life" d="M224 72 V576"/>
<path class="life" d="M376 72 V576"/>
<path class="life" d="M512 72 V576"/>
<path class="life" d="M656 72 V576"/>
<path class="life" d="M792 72 V576"/>
<path class="thin" d="M72 120 H223" marker-end="url(#ds-hr)"/>
<text class="m" x="148" y="105" text-anchor="middle" dominant-baseline="central">1 deploy(notes)</text>
<path class="thin" d="M224 168 H375" marker-end="url(#ds-hr)"/>
<text class="s" x="300" y="153" text-anchor="middle" dominant-baseline="central">2 issue a workload</text>
<path class="dash" d="M376 216 H225" marker-end="url(#ds-hr)"/>
<text class="m" x="300" y="201" text-anchor="middle" dominant-baseline="central">forge: read</text>
<path class="thin" d="M224 264 H511" marker-end="url(#ds-hr)"/>
<text class="s" x="300" y="234" text-anchor="middle" dominant-baseline="central">3 fetch main</text>
<text class="s" x="300" y="249" text-anchor="middle" dominant-baseline="central">as the workload</text>
<path class="dash" d="M512 312 H225" marker-end="url(#ds-hr)"/>
<text class="s" x="300" y="297" text-anchor="middle" dominant-baseline="central">each repo's tree</text>
<path class="bold" d="M224 360 H655" marker-end="url(#ds-hi)"/>
<text class="s" x="300" y="345" text-anchor="middle" dominant-baseline="central">4 the release</text>
<path class="bold" d="M656 408 H791" marker-end="url(#ds-hi)"/>
<text class="s" x="724" y="393" text-anchor="middle" dominant-baseline="central">5 start on it</text>
<path class="dash" d="M792 456 H657" marker-end="url(#ds-hr)"/>
<text class="s" x="724" y="441" text-anchor="middle" dominant-baseline="central">answers on its port</text>
<path class="dash" d="M656 504 H225" marker-end="url(#ds-hr)"/>
<text class="s" x="300" y="489" text-anchor="middle" dominant-baseline="central">6 serving</text>
<path class="dash" d="M224 552 H73" marker-end="url(#ds-hr)"/>
<text class="s" x="148" y="537" text-anchor="middle" dominant-baseline="central">the deployment</text>
</svg>
