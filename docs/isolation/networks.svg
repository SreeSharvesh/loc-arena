<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" role="img" aria-label="Deployment of a stack run on three networks. The model gateway alone joins all three: it holds the key and is the only route out to OpenRouter over egress-net, and it sends each call's record to the collector over record-net. On agent-net, which is internal with no route out, the episode commands each agent's sandbox and both send tool calls to agentgateway, which calls the live services as the agent. A sandbox also calls a service with rights over HTTP with its own identity. The agents service commands the runner pool and the job service runs jobs on the node pool. The episode, the sandboxes, the runners and the nodes make model calls to the gateway, and the host's monitors reach it on a loopback port.">
<style>
  svg { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; --panel:#f6f8fa;
        --accent:#2f4bd6; --accent-bg:#e9edfd;
        --sealed:#0d9488; --sealed-bg:#d9f2ef; --observe:#b3730a; --observe-bg:#f8ecd5; --attack:#d63f4a; --attack-bg:#fbe3e4; }
  @media (prefers-color-scheme: dark) {
    svg { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; --panel:#161b22;
          --accent:#8098ff; --accent-bg:#1b2340;
          --sealed:#3ad6c4; --sealed-bg:#12312e; --observe:#e0a94a; --observe-bg:#33280f; --attack:#f47b82; --attack-bg:#3a1c20; }
  }
  text { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  .box { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .focus { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
  .ext { fill:none; stroke:var(--rule); stroke-width:1.25; stroke-dasharray:5 4; }
  .region { fill:none; stroke:var(--rule); stroke-width:1; }
  .t { fill:var(--ink); font-size:13px; font-weight:600; }
  .s { fill:var(--muted); font-size:11px; }
  .m { fill:var(--muted); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .bold { stroke:var(--ink); stroke-width:2.5; fill:none; }
  .thin { stroke:var(--rule); stroke-width:1.25; fill:none; }
  .head-ink { fill:var(--ink); } .head-rule { fill:var(--rule); }
</style>
<defs>
  <marker id="hi" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="hr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-rule" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- Outside the system -->
<g class="node"><rect class="ext" x="56" y="16" width="96" height="48" rx="6"/>
  <text class="t" x="104" y="33" text-anchor="middle" dominant-baseline="central">OpenRouter</text>
  <text class="s" x="104" y="50" text-anchor="middle" dominant-baseline="central">the provider</text></g>
<g class="node"><rect class="ext" x="648" y="16" width="104" height="48" rx="6"/>
  <text class="t" x="700" y="33" text-anchor="middle" dominant-baseline="central">Host</text>
  <text class="s" x="700" y="50" text-anchor="middle" dominant-baseline="central">the monitors</text></g>

<!-- Networks -->
<rect class="region" x="16" y="96" width="104" height="144" rx="6"/>
<text class="t" x="32" y="114" dominant-baseline="central">Egress</text>
<text class="m" x="32" y="130" dominant-baseline="central">egress-net</text>
<text class="s" x="32" y="146" dominant-baseline="central">route out</text>

<rect class="region" x="136" y="96" width="552" height="648" rx="6"/>
<text class="t" x="152" y="114" dominant-baseline="central">Agents and services</text>
<text class="m" x="152" y="130" dominant-baseline="central">agent-net</text>
<text class="s" x="152" y="146" dominant-baseline="central">internal, no route out</text>

<rect class="region" x="712" y="96" width="112" height="256" rx="6"/>
<text class="t" x="728" y="114" dominant-baseline="central">Records</text>
<text class="m" x="728" y="130" dominant-baseline="central">record-net</text>
<text class="s" x="728" y="146" dominant-baseline="central">internal</text>

<!-- The model gateway: on all three networks -->
<g class="node"><rect class="focus" x="32" y="160" width="776" height="64" rx="6"/>
  <text class="t" x="420" y="178" text-anchor="middle" dominant-baseline="central">Model gateway</text>
  <text class="m" x="420" y="194" text-anchor="middle" dominant-baseline="central">gateway</text>
  <text class="s" x="420" y="210" text-anchor="middle" dominant-baseline="central">holds the key, admits each caller by its token, records every call</text></g>

<!-- agent-net: callers -->
<g class="node"><rect class="box" x="152" y="272" width="120" height="64" rx="6"/>
  <text class="t" x="212" y="290" text-anchor="middle" dominant-baseline="central">Agent loops</text>
  <text class="m" x="212" y="306" text-anchor="middle" dominant-baseline="central">episode</text>
  <text class="s" x="212" y="322" text-anchor="middle" dominant-baseline="central">plays the episode</text></g>
<g class="node"><rect class="box" x="344" y="272" width="120" height="64" rx="6"/>
  <text class="t" x="404" y="290" text-anchor="middle" dominant-baseline="central">Agent's code</text>
  <text class="m" x="404" y="306" text-anchor="middle" dominant-baseline="central">sandbox-&lt;agent&gt;</text>
  <text class="s" x="404" y="322" text-anchor="middle" dominant-baseline="central">one per agent</text></g>
<g class="node"><rect class="box" x="152" y="392" width="120" height="64" rx="6"/>
  <text class="t" x="212" y="410" text-anchor="middle" dominant-baseline="central">MCP route</text>
  <text class="m" x="212" y="426" text-anchor="middle" dominant-baseline="central">agentgateway</text>
  <text class="s" x="212" y="442" text-anchor="middle" dominant-baseline="central">per-agent tools</text></g>

<!-- agent-net: live services -->
<rect class="region" x="144" y="496" width="328" height="232" rx="6"/>
<text class="t" x="232" y="514" dominant-baseline="central">Live services</text>
<text class="s" x="232" y="530" dominant-baseline="central">one container each</text>
<g class="node"><rect class="box" x="152" y="552" width="120" height="160" rx="6"/>
  <text class="t" x="212" y="584" text-anchor="middle" dominant-baseline="central">Other services</text>
  <text class="m" x="212" y="608" text-anchor="middle" dominant-baseline="central">notes · chat</text>
  <text class="m" x="212" y="626" text-anchor="middle" dominant-baseline="central">forge · tickets</text>
  <text class="m" x="212" y="644" text-anchor="middle" dominant-baseline="central">evalkit · iam</text>
  <text class="m" x="212" y="662" text-anchor="middle" dominant-baseline="central">phoenix · …</text></g>
<g class="node"><rect class="box" x="344" y="552" width="120" height="64" rx="6"/>
  <text class="t" x="404" y="576" text-anchor="middle" dominant-baseline="central">Agents service</text>
  <text class="m" x="404" y="594" text-anchor="middle" dominant-baseline="central">agents</text></g>
<g class="node"><rect class="box" x="344" y="648" width="120" height="64" rx="6"/>
  <text class="t" x="404" y="672" text-anchor="middle" dominant-baseline="central">Job service</text>
  <text class="m" x="404" y="690" text-anchor="middle" dominant-baseline="central">jobsvc</text></g>

<!-- agent-net: pools -->
<g class="node"><rect class="box" x="544" y="552" width="112" height="64" rx="6"/>
  <text class="t" x="600" y="570" text-anchor="middle" dominant-baseline="central">Runner pool</text>
  <text class="m" x="600" y="586" text-anchor="middle" dominant-baseline="central">runner-&lt;n&gt;</text>
  <text class="s" x="600" y="602" text-anchor="middle" dominant-baseline="central">company agents</text></g>
<g class="node"><rect class="box" x="544" y="648" width="112" height="64" rx="6"/>
  <text class="t" x="600" y="666" text-anchor="middle" dominant-baseline="central">Node pool</text>
  <text class="m" x="600" y="682" text-anchor="middle" dominant-baseline="central">node-&lt;n&gt;</text>
  <text class="s" x="600" y="698" text-anchor="middle" dominant-baseline="central">one job at a time</text></g>

<!-- record-net -->
<g class="node"><rect class="box" x="720" y="272" width="96" height="64" rx="6"/>
  <text class="t" x="768" y="290" text-anchor="middle" dominant-baseline="central">Seals records</text>
  <text class="m" x="768" y="306" text-anchor="middle" dominant-baseline="central">collector</text>
  <text class="s" x="768" y="322" text-anchor="middle" dominant-baseline="central">own volume</text></g>

<!-- The model-call path, the one bold path: episode to the gateway, the gateway out to OpenRouter -->
<path class="bold" d="M212 272 V225" marker-end="url(#hi)"/>
<text class="s" x="220" y="248" dominant-baseline="central">model calls</text>
<path class="bold" d="M104 160 V65" marker-end="url(#hi)"/>
<text class="s" x="112" y="80" dominant-baseline="central">the only route out</text>

<!-- Other model calls -->
<path class="thin" d="M404 272 V225" marker-end="url(#hr)"/>
<path class="thin" d="M600 552 V225" marker-end="url(#hr)"/>
<path class="thin" d="M656 680 H672 V225" marker-end="url(#hr)"/>
<text class="s" x="636" y="404" text-anchor="middle" dominant-baseline="central">runners'</text>
<text class="s" x="636" y="418" text-anchor="middle" dominant-baseline="central">route</text>
<path class="thin" d="M700 64 V159" marker-end="url(#hr)"/>
<text class="s" x="692" y="80" text-anchor="end" dominant-baseline="central">loopback port</text>
<path class="thin" d="M768 224 V271" marker-end="url(#hr)"/>
<text class="s" x="776" y="248" dominant-baseline="central">records</text>

<!-- Commands and tool calls -->
<path class="thin" d="M272 304 H343" marker-end="url(#hr)"/>
<text class="s" x="308" y="294" text-anchor="middle" dominant-baseline="central">commands</text>
<path class="thin" d="M212 336 V391" marker-end="url(#hr)"/>
<text class="s" x="220" y="364" dominant-baseline="central">tool calls</text>
<path class="thin" d="M368 336 V424 H273" marker-end="url(#hr)"/>
<text class="s" x="320" y="414" text-anchor="middle" dominant-baseline="central">from bash</text>
<path class="thin" d="M440 336 V495" marker-end="url(#hr)"/>
<text class="s" x="448" y="404" dominant-baseline="central">HTTP with</text>
<text class="s" x="448" y="418" dominant-baseline="central">its identity</text>
<path class="thin" d="M212 456 V495" marker-end="url(#hr)"/>
<text class="s" x="220" y="476" dominant-baseline="central">as the agent</text>
<path class="thin" d="M464 584 H543" marker-end="url(#hr)"/>
<text class="s" x="508" y="574" text-anchor="middle" dominant-baseline="central">commands</text>
<path class="thin" d="M464 680 H543" marker-end="url(#hr)"/>
<text class="s" x="508" y="670" text-anchor="middle" dominant-baseline="central">runs jobs</text>
</svg>
