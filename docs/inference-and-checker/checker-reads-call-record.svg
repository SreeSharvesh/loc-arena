<svg xmlns="http://www.w3.org/2000/svg" width="824" height="312" viewBox="0 0 824 312" role="img" aria-label="The side-task checker reads the gateway's call record, the nodes' process facts and the job service's record, joins each call to its job by node and time, treats sanctioned work as on-path, and reports the off-path calls, the loop and the landing">
<style>
  svg { --ink:#1f2328; --muted:#59636e; --rule:#8c959f; --panel:#f6f8fa;
        --accent:#2f4bd6; --accent-bg:#e9edfd;
        --sealed:#0d9488; --sealed-bg:#d9f2ef; --observe:#b3730a; --observe-bg:#f8ecd5; --attack:#d63f4a; --attack-bg:#fbe3e4; }
  @media (prefers-color-scheme: dark) {
    svg { --ink:#e6edf3; --muted:#9198a1; --rule:#6e7681; --panel:#161b22;
          --accent:#8098ff; --accent-bg:#1b2340;
          --sealed:#3ad6c4; --sealed-bg:#12312e; --observe:#e0a94a; --observe-bg:#33280f; --attack:#f47b82; --attack-bg:#3a1c20; }
  }
  text { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  .box { fill:var(--panel); stroke:var(--rule); stroke-width:1; }
  .focus { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
  .ext { fill:none; stroke:var(--rule); stroke-width:1.25; stroke-dasharray:5 4; }
    .sealed-fill { fill:var(--sealed-bg); stroke:var(--sealed); stroke-width:1.25; }
  .t { fill:var(--ink); font-size:13px; font-weight:600; }
  .s { fill:var(--muted); font-size:11px; }
  .m { fill:var(--muted); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .tag { fill:var(--accent); font-size:11px; font-weight:600; }
  .bold { stroke:var(--ink); stroke-width:2.5; fill:none; }
  .thin { stroke:var(--rule); stroke-width:1.25; fill:none; }
  .head-ink { fill:var(--ink); } .head-rule { fill:var(--rule); }
</style>
<defs>
  <marker id="f1hi" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-ink" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="f1hr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-rule" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- gateway call record (store) -->
<g class="node">
  <path class="sealed-fill" d="M40 58 a104 11 0 0 1 208 0 v64 a104 11 0 0 1 -208 0 z"/>
  <path class="sealed-fill" d="M40 58 a104 11 0 0 0 208 0" fill="none"/>
  <text class="t" x="144" y="86" text-anchor="middle">Gateway call record</text>
  <text class="m" x="144" y="104" text-anchor="middle">logs/gateway/*.calls.jsonl</text>
</g>

<!-- job service records (store) -->
<g class="node">
  <path class="box" d="M40 200 a104 11 0 0 1 208 0 v64 a104 11 0 0 1 -208 0 z"/>
  <path class="box" d="M40 200 a104 11 0 0 0 208 0" fill="none"/>
  <text class="t" x="144" y="228" text-anchor="middle">Process facts, job record</text>
  <text class="m" x="144" y="246" text-anchor="middle">node-N.log, jobsvc.log</text>
</g>

<!-- sanctioned work (external entity, from seed) -->
<g class="node">
  <rect class="ext" x="356" y="20" width="208" height="68" rx="6"/>
  <text class="t" x="460" y="42" text-anchor="middle">Sanctioned work</text>
  <text class="s" x="460" y="60" text-anchor="middle">episode, host, runners,</text>
  <text class="s" x="460" y="76" text-anchor="middle">seeded jobs, eval-run jobs</text>
</g>

<!-- checker (process, focus) -->
<g class="node">
  <rect class="focus" x="356" y="132" width="208" height="92" rx="14"/>
  <text class="t" x="460" y="162" text-anchor="middle">Side-task checker</text>
  <text class="m" x="460" y="180" text-anchor="middle">side_task.py</text>
  <text class="s" x="460" y="200" text-anchor="middle">join each call to its job</text>
  <text class="s" x="460" y="214" text-anchor="middle">by node and time</text>
</g>

<!-- verdict (result tag) -->
<g class="node">
  <rect class="box" x="648" y="140" width="156" height="76" rx="6"/>
  <text class="t" x="726" y="167" text-anchor="middle">Verdict</text>
  <text class="s" x="726" y="186" text-anchor="middle">off-path calls, loop,</text>
  <text class="s" x="726" y="200" text-anchor="middle">minimal landing</text>
</g>

<!-- arrows -->
<path class="bold" d="M248 90 H300 V172 H355" marker-end="url(#f1hi)"/>
<path class="thin" d="M248 232 H300 V186 H355" marker-end="url(#f1hr)"/>
<path class="thin" d="M460 88 V131" marker-end="url(#f1hr)"/>
<path class="bold" d="M564 178 H647" marker-end="url(#f1hi)"/>

<text class="tag" x="274" y="150" text-anchor="middle">calls</text>
<text class="s" x="452" y="116" text-anchor="end">on-path (sanctioned work)</text>
</svg>
