[project]
name = "loc-arena"
version = "0.0.0"
description = "LOC-Arena: an AI-control evaluation setting for internal rogue-deployment detection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "inspect-ai>=0.3.239,<0.4",
  "pygments>=2.18",
]

[project.scripts]
loc-arena = "loc_arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loc_arena"]

[dependency-groups]
# Dev toolchain. Kept minimal for the skeleton; phases add their own runtime deps (Inspect, FastAPI, ...).
dev = [
  "ruff>=0.6",
  "ty>=0.0.84",
  "pytest>=8.0",
  "types-PyYAML>=6.0",
  "types-pygments>=2.18",
]

# ---------------------------------------------------------------------------
# ruff: lint + format. Config lives here, not in code (config over code).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 110
# The company workspace (company/<repo>/) is real, tested Meridian code held to the same bar; each repo's
# package root is a first-party src root so imports sort correctly.
src = [
  "loc_arena",
  "tests",
  "company/meridian-common",
  "company/meridian-serving",
  "company/meridian-datapipe",
  "company/meridian-distill",
  "company/meridian-jobsvc",
  "company/meridian-controlplane",
  "company/meridian-evalkit",
]
# A scenario pack's seed/ is the lived-in agent workspace (graded by ITS OWN pytest) and reference/ is the
# sealed grader fixture overlaid at grade time; both run only as subprocesses and follow the seed's terse
# conventions, so they are fixtures, not our package code. (repos_seed/ is the legacy path.)
extend-exclude = ["repos_seed", "scenarios/*/seed", "scenarios/*/reference"]

[tool.ruff.lint]
# A pragmatic-but-strict default set. Expanded per phase as real code lands.
# COM812 adds a trailing comma to every multi-line call/collection; the formatter's magic trailing comma then
# keeps it one-element-per-line. (Only COM812: COM819 would strip the commas that trigger the explode.)
# ANN requires every def to be fully annotated (ty, unlike mypy --strict, does not check that).
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "COM812", "ANN", "PLC0415"]
ignore = [
  "D203",   # one-blank-line-before-class (conflicts with D211)
  "D213",   # multi-line-summary-second-line (conflicts with D212)
  "ANN401", # explicit Any is allowed (JSON payloads, **kwargs passthrough)
]

[tool.ruff.lint.per-file-ignores]
# Tests do not need module/function docstrings.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"company/**/tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
# The viewer embeds an HTML/CSS/JS template string where line length is not meaningful.
"loc_arena/logging_/viewer.py" = ["E501"]
"loc_arena/logging_/agent_trace.py" = ["D102", "D103", "D107"]
"loc_arena/logging_/inspect_export.py" = ["D103"]
"loc_arena/logging_/transcript_lanes.py" = ["D103"]
"loc_arena/logging_/transcript_render.py" = ["D103", "E501"]
# The harness imports the Inspect exporter and renderer lazily inside _write_bundle/_eval_episodes: inspect_ai
# loads ~1200 modules (docs/agent-log/agent.md), and that stack keeps function bodies free of comments.
"loc_arena/harness.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# ty: type checking (ty clean; warnings fail too).
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
# The company workspace: each repo's package root is on the search path so cross-repo imports
# (meridian_common, ...) resolve exactly like a real multi-repo checkout. Add each new repo root here as it lands.
extra-paths = [
  "company/meridian-common",
  "company/meridian-serving",
  "company/meridian-datapipe",
  "company/meridian-distill",
  "company/meridian-jobsvc",
  "company/meridian-controlplane",
  "company/meridian-evalkit",
]

[tool.ty.src]
include = ["loc_arena", "tests", "scenarios", "company"]
# A pack's seed/ and reference/ are subprocess-run fixtures (the lived-in workspace + the sealed grader),
# not typed package code; the loader + main.py/side.py glue above them IS checked.
exclude = ["scenarios/*/seed", "scenarios/*/reference", "repos_seed"]

[tool.ty.rules]
unused-ignore-comment = "error"

# ---------------------------------------------------------------------------
# pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# The engine suite (tests/) plus every company repo's own suite. Each repo's package root is on pythonpath so
# `import meridian_common` (and, later, the other repos) resolves like a real side-by-side workspace checkout.
testpaths = ["tests", "company"]
pythonpath = [
  "company/meridian-common",
  "company/meridian-serving",
  "company/meridian-datapipe",
  "company/meridian-distill",
  "company/meridian-jobsvc",
  "company/meridian-controlplane",
  "company/meridian-evalkit",
]
addopts = "-ra"
markers = [
  "integration: tests that need docker and/or network (skip-guarded)",
]
