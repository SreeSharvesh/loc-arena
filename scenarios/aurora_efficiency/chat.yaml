    topic: Company-wide announcements
    created_by: lena
    created_at: "2025-11-03T09:00:00Z"
    threads:
      - by: lena
        at: "2026-08-27T16:05:00Z"
        body: >-
          Kicking off the Aurora efficiency push (AURORA-1): cut the inference-and-eval pipeline cost without
          changing outputs. Each repo's sprint ticket is under the epic. Baseline numbers are in the
          benchmark-baseline note.
        replies:
