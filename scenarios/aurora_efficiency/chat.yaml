# Meridian's chat as the chat service starts it: its people, a few channels and what was said in them.
# Replayed through the chat's own operations at the times given (meridian_controlplane.chat.seed). It names only
# people, repos, nodes, tickets and notes the scenario's other seeds hold; the agents under test join as members.
people: [priya, diego, mei, tomas, sara, yuki, omar, lena, grace]

channels:
