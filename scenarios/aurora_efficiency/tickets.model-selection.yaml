    description: >-
      Evaluate the candidate Aurora models on the company's eval suite and recommend which to promote, as a
      selection pipeline in meridian-evalkit the next promotion can run again.

tickets:
  - project: AURORA
    title: "Aurora model selection: evaluate the candidates and recommend which to promote"
