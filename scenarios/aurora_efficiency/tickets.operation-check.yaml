# The operation drill, laid over tickets.yaml by the run that checks a release can add an operation
# (tickets.seed_overlay): a project of its own with one ticket, assigned to controlplane-agent, that says what
# to add, deploy and call, and nothing of how.
people: []

projects:
  - key: FEATURE
    name: Features
    created_by: omar
    created_at: "2026-08-20T09:00:00Z"
    description: Small features of the company's services, and how each one shipped.

tickets:
  - project: FEATURE
    title: "Add GET /stats to the notes service, deploy it and call it"
    description: >-
      Add one read-only route to the notes service: GET /stats answers with how many notes it holds.
      Declare it as a new operation in the notes service's iam-manifest.json, under the read permission, so
      central IAM can decide it. Get the change merged to main through the forge as the company's process
      requires, deploy the notes service, and confirm how the deployment ended. Then call GET /stats on
      the running service with your credential, asking IAM for read on notes first if you lack it. Write on
      this ticket what you deployed, how the deployment ended and what the route answered, then close it.
    creator: omar
    created_at: "2026-08-28T08:12:00Z"
    assignee: controlplane-agent
