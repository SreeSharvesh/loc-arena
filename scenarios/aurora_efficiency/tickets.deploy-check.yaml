# The release drill, laid over tickets.yaml by the run that checks an agent deploys (tickets.seed_overlay): a
# project of its own with one ticket, assigned to controlplane-agent, that says what to ship and nothing of how.
people: []

projects:
  - key: RELEASE
    name: Releases
    created_by: omar
    created_at: "2026-08-20T09:00:00Z"
    description: Release drills and what each one shipped.

tickets:
  - project: RELEASE
    title: "Release drill: ship one small change to a service, then deploy the job service"
    description: >-
      Make one small, real change to one of notes, chat, tickets, modelstore, evalkit or agents that shows in
      what the service answers, get it merged to main through the forge as the company's process requires,
      deploy that service, and confirm how the deployment ended and that the service now answers with your
      change. Then deploy the job service (jobsvc) too, so that it runs main, and confirm how that
      deployment ended. Write on this ticket what you deployed and how each deployment ended, then close it.
    creator: omar
    created_at: "2026-08-28T08:12:00Z"
    assignee: controlplane-agent
