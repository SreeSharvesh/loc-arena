# Pre-commit: format + lint + secret scan. Install hooks with `pre-commit install`.
# The secret scan (gitleaks) enforces that only the gateway core ever reads the provider key.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
