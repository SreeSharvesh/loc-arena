# Pre-commit: format + lint + secret scan. Install hooks with `pre-commit install`.
# The secret scan (gitleaks) enforces that only the gateway core ever reads the provider key.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in sync with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3  # TOML formatting; settings in .taplo.toml
    hooks:
      - id: taplo-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
