# Spike: agentgateway in place of loc_arena/gateway/proxy.py, against the mock upstream.
# Callers are admitted by the SHA-256 of their sandbox token, as the tools gateway already does.
# Runners use their own route (/runner/api/v1/...) whose policies hold the model allowlist and the per-play cap.
config:
  adminAddr: "off"
  statsAddr: "off"
  readinessAddr: "off"
  logging:
    format: json
frontendPolicies:
  http:
    maxBufferSize: 33554432
  accessLog:
    add:
      caller: apiKey.agent
      role: apiKey.role
      model: llm.requestModel
      in_tokens: llm.inputTokens
      out_tokens: llm.outputTokens
      request_body: string(request.body)
      response_body: string(response.body)
x-upstream: &upstream
  - ai:
      name: upstream
      hostOverride: agwspike-mock:9000
      provider:
        custom:
          formats:
          - type: completions
            path: /api/v1/chat/completions
x-keys: &keys
  apiKey:
    mode: strict
    location:
      header:
        name: authorization
        prefix: "Bearer "
    keys:
    - keyHash: "sha256:4044afa3d77e45c39e47401e32d3d1d4a8cbdfcc77dddb4a7067aa58b81abf8d"
      metadata: {agent: agent-main, role: sandbox}
    - keyHash: "sha256:2ba8978b0935203aca7c65c5acd53fa15b90a2de8e5ed42d09220ce7a67d3508"
      metadata: {agent: agent-helper, role: sandbox}
    - keyHash: "sha256:1068b72285301556d3a3b68da9c3f7b39a58a4ee1209bc11230379df1da53fcb"
      metadata: {agent: runner-1, role: runner}
  backendAuth:
    key:
      file: /run/secrets/openrouter_api_key
binds:
- port: 8080
  listeners:
  - routes:
    - name: sandboxes
      matches:
      - path: {exact: /api/v1/chat/completions}
      - path: {exact: /api/v1/completions}
      - path: {exact: /api/v1/models}
      policies:
        <<: *keys
        authorization:
          rules:
          # Reading request.body here buffers it, so the record keeps it even when the upstream is never reached.
          - allow: 'apiKey.role == "sandbox" && size(request.body) >= 0'
        ai:
          routes:
            /chat/completions: completions
            "*": passthrough
      backends: *upstream
    - name: runners
      matches:
      - path: {exact: /runner/api/v1/chat/completions}
      policies:
        <<: *keys
        urlRewrite:
          path:
            full: /api/v1/chat/completions
        authorization:
          rules:
          - allow: 'apiKey.role == "runner" && json(request.body).model in ["deepseek/deepseek-v4.1-flash"]'
        localRateLimit:
        - type: requests
          maxTokens: 3
          tokensPerFill: 1
          fillInterval: 87600h
        ai:
          routes:
            "*": completions
      backends: *upstream
