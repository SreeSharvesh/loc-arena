<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img" aria-label="Step 1: every caller reaches agentgateway with its own token; agentgateway calls OpenRouter with the key and exports each call over OTLP to an OpenTelemetry Collector, which writes the sealed record">
  <defs>
    <marker id="s1a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
    <marker id="s1g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 13px; font-weight: 600; }
    .s { font-size: 11px; fill: #57606a; }
    .m { font-size: 11px; fill: #57606a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect x="0" y="0" width="760" height="232" fill="#ffffff"/>
  <g class="node"><rect x="24" y="24" width="184" height="56" rx="2" fill="#ffffff" stroke="#6e7781" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text class="t" x="116" y="46" text-anchor="middle" dominant-baseline="central">Every caller</text>
    <text class="s" x="116" y="64" text-anchor="middle" dominant-baseline="central">sends its own token</text></g>
  <g class="node"><rect x="288" y="24" width="184" height="56" rx="10" fill="#e8f1f8" stroke="#0072B2" stroke-width="1.5"/>
    <text class="t" x="380" y="46" text-anchor="middle" dominant-baseline="central">agentgateway</text>
    <text class="s" x="380" y="64" text-anchor="middle" dominant-baseline="central">holds the key</text></g>
  <g class="node"><rect x="552" y="24" width="184" height="56" rx="2" fill="#ffffff" stroke="#6e7781" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text class="t" x="644" y="46" text-anchor="middle" dominant-baseline="central">OpenRouter</text>
    <text class="s" x="644" y="64" text-anchor="middle" dominant-baseline="central">real models</text></g>
  <g class="node"><rect x="288" y="144" width="184" height="56" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="1.25"/>
    <text class="t" x="380" y="166" text-anchor="middle" dominant-baseline="central">OTel Collector</text>
    <text class="s" x="380" y="184" text-anchor="middle" dominant-baseline="central">file exporter</text></g>
  <g class="node">
    <path d="M560 152 V196 A84 8 0 0 0 728 196 V152" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.25"/>
    <ellipse cx="644" cy="152" rx="84" ry="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.25"/>
    <text class="t" x="644" y="174" text-anchor="middle" dominant-baseline="central">Sealed record</text>
    <text class="m" x="644" y="192" text-anchor="middle" dominant-baseline="central">calls.jsonl</text></g>
  <text class="s" x="390" y="112" dominant-baseline="central">OTLP</text>
  <line x1="208" y1="52" x2="288" y2="52" stroke="#0072B2" stroke-width="2.5" marker-end="url(#s1a)"/>
  <line x1="472" y1="52" x2="552" y2="52" stroke="#0072B2" stroke-width="2.5" marker-end="url(#s1a)"/>
  <line x1="380" y1="80" x2="380" y2="144" stroke="#6e7781" stroke-width="1.25" marker-end="url(#s1g)"/>
  <line x1="472" y1="172" x2="560" y2="172" stroke="#6e7781" stroke-width="1.25" marker-end="url(#s1g)"/>
</svg>
