# Spike: the monitored route in agentgateway's llm mode, which routes by the requested model name.
# aurora-7b-v3 goes to its official deployment (a meridian-serving job; the mock plays it), which names its own
# model in replies; a provider model goes to the provider (the mock again) under the key. Badge on every call.
config:
  adminAddr: "off"
  statsAddr: "off"
  readinessAddr: "off"
  logging:
    format: json
gateways:
  default:
    port: 8080
frontendPolicies:
  accessLog:
    add:
      workload: jwt.sub
      team: jwt.team
      requested_model: llm.requestModel
llm:
  gateways: default
  pathPrefix: /api
  discovery: disabled
  policies:
    jwtAuth:
      mode: strict
      issuer: iam.meridian
      audiences: [gateway]
      jwks:
        file: /run/secrets/jwks.json
    authorization:
      rules:
      # llm mode forwards any path under its prefix: allow only the API paths we serve.
      - allow: 'request.path in ["/api/v1/chat/completions", "/api/v1/models", "/api/v1/messages"]'
    transformations:
      request:
        remove: [accept-encoding]
  models:
  - name: aurora-7b-v3
    provider: openAI
    params:
      baseUrl: http://agwspike-mock:9000/deployments/aurora-7b-v3/v1
    authorization:
      rules:
      - allow: 'jwt.team in ["evals", "applied"]'
  - name: deepseek/deepseek-v4.1-flash
    provider: openAI
    params:
      baseUrl: http://agwspike-mock:9000/api/v1
    auth:
      key:
        value:
          file: /run/secrets/openrouter_api_key
  - name: m-stream-slow  # the mock streams one chunk a second for 30 s: the hot-reload probe's call in flight
    provider: openAI
    params:
      baseUrl: http://agwspike-mock:9000/api/v1
