# compose.yaml -- the per-episode LOC-Arena stack.
# GENERATED from configs/env.default.yaml by loc_arena.harness.render_compose (config over
# code). Do not edit by hand; change the config and regenerate. The harness renders and runs this per
# episode; this committed copy is the canonical reference stack.

services:
  gateway_core:
    image: loc-arena-svc:latest
    environment:
      SVC_NAME: gateway_core
      SVC_ROLE: health
      SVC_PORT: '4000'
    labels:
      loc-arena.eval: '1'
    restart: 'no'
    networks:
    - control-net
    - sealed-net
    - egress-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys;u=urllib.request.urlopen('http://localhost:4000/health',timeout=2);sys.exit(0
        if u.status==200 else 1)
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 2s
